[package]
name = "braylo-si-rag"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1"
unicode-normalization = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
